<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">Neural network, animated</title><desc id="desc">Minimal layered neural network with softly pulsing nodes and traveling activation signals.</desc>
<style>
  .edge { stroke:#577891; stroke-width:1; opacity:.22; fill:none; }
  .node { fill:#0e202f; stroke:#38aacf; stroke-width:1.5; }
  .core { fill:#9cecff; opacity:.36; }
  .label { fill:#7898a9; font: 11px ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:2.6px; }
  .signal { fill:none; stroke:#88edff; stroke-width:1.9; stroke-linecap:round; opacity:0; stroke-dasharray:3 1100; animation:flow 7.2s linear infinite; }
  .signal.b {stroke:#75a6ee;animation-delay:-2.4s}
  .signal.c {stroke:#a1e6c4;animation-delay:-4.8s}
  .pulse {animation:glow 3.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
  .pulse.b {animation-delay:-1.2s} .pulse.c {animation-delay:-2.4s}
  @keyframes flow {0%{stroke-dashoffset:400;opacity:0} 12%{opacity:.95} 80%{opacity:.8} 100%{stroke-dashoffset:-400;opacity:0}}
  @keyframes glow {0%,100%{opacity:.22} 42%{opacity:.95}}
  @media (prefers-reduced-motion:reduce) {.signal,.pulse {animation:none} .pulse{opacity:.65} .signal{opacity:0}}
  @media (prefers-color-scheme:light) {.edge{stroke:#376785;opacity:.25} .node{fill:#effaff;stroke:#13668b} .core{fill:#167b9f} .label{fill:#47738a}}
</style>
